<style>
/* Layout: MCLA conference companion. Cream page, white cards, teal actions, coral section labels; three tabs and a reading panel. Brand tokens from mantlecellalliance.org. */
:root{
  --bg:#f5f1ec; --surface:#ffffff; --ink:#1A2E30; --muted:#4A6264; --faint:#7A9295; --line:#e8e4de; --field:#d8d4ce;
  --teal:#0a6c6e; --teal-light:#0D8386; --navy:#0f396a; --coral:#ef6d47; --coral-soft:#fdeee8; --teal-soft:#e4efef;
  --accent:var(--teal); --accent-ink:#ffffff; --accent-soft:var(--teal-soft); --key:#b84a28; --key-soft:var(--coral-soft);
  --scrim:rgba(15,57,106,.35);
  --serif:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button{font:inherit;color:inherit}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--coral)}
h1{font-weight:900;font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.5px;margin:8px 0 12px;text-wrap:balance;color:var(--ink)}
h2{font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.2px;margin:0;text-wrap:balance}
h3{font-weight:800;font-size:18px;line-height:1.3;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
/* gate */
.gate{min-height:85vh;display:grid;place-items:center;padding-block:40px}
.gate-card{width:100%;max-width:440px;background:var(--surface);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(15,57,106,.08)}
.gate-card .sym{height:56px;display:block;margin-bottom:16px}
.gate-card p{color:var(--muted);margin:0 0 20px}
.gate form{display:grid;gap:10px}
label.lbl{font-size:14px;font-weight:700}
input[type=password],input[type=search]{width:100%;font:inherit;font-size:15px;padding:13px 22px;border:2px solid var(--field);border-radius:999px;background:var(--bg);color:var(--ink)}
input[type=password]:focus,input[type=search]:focus{outline:none;border-color:var(--teal)}
.primary{font-weight:700;letter-spacing:.3px;padding:14px 28px;border-radius:999px;border:0;background:var(--teal);color:#fff;cursor:pointer}
.primary:hover{background:var(--teal-light)}
.err{color:#b3261e;font-size:14px;min-height:1.2em}
/* header + tabs */
header.top{padding-block:28px 4px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brandbar img{height:68px;width:auto}
.brandbar .tag{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--navy);background:var(--surface);border-radius:999px;padding:6px 14px}
.lede{max-width:60ch;color:var(--muted);margin:0 0 24px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:8px;padding-block:10px;overflow-x:auto}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--teal);font-weight:800;font-size:15px;padding:10px 20px;border-radius:999px;border:1px solid rgba(10,108,110,.3);background:rgba(255,255,255,.7)}
nav.tabs a:hover{border-color:var(--teal);background:#fff}
nav.tabs a[aria-current="page"]{background:var(--teal);border-color:var(--teal);color:#fff}
nav.tabs .n{font-weight:600;font-size:12px;margin-left:6px;opacity:.8}
.view{padding-top:20px}
.intro{color:var(--muted);margin:0 0 22px;max-width:62ch}
/* highlight cards */
.hl{display:grid;gap:14px}
.hcard{background:var(--surface);border-radius:20px;padding:22px 24px;display:grid;gap:12px;box-shadow:0 1px 2px rgba(15,57,106,.05)}
.hcard .take{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
.hcard .t{font-size:14px;color:var(--muted)}
.when{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center;color:var(--muted)}
.when b{font-weight:700;color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:2px 10px;min-height:22px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.pill.key{background:var(--coral-soft);color:var(--key)}
.linkbtn{justify-self:start;background:none;border:1px solid rgba(10,108,110,.3);border-radius:999px;padding:8px 18px;color:var(--teal);font-weight:800;font-size:14px;cursor:pointer}
.linkbtn:hover{border-color:var(--teal);background:var(--teal-soft)}
/* schedule */
.days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;border:2px solid var(--field);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin:4px 0 22px}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}
.slot{display:grid;grid-template-columns:9.5em 1fr;gap:6px 18px;padding-block:20px;border-top:2px solid var(--line)}
.slot .time{font-size:16px;font-weight:800;color:var(--navy);line-height:1.35;font-variant-numeric:tabular-nums}
.sessions{display:grid;gap:14px;min-width:0}
.sess{background:var(--surface);border-radius:20px;padding:18px 20px;min-width:0}
.sess .where{font-weight:800;font-size:16px;color:var(--ink)}
.sess .where span{font-weight:500;color:var(--muted)}
.sess .sname{font-size:14px;color:var(--muted);margin:4px 0 12px;line-height:1.5}
.sess ol{margin:0;padding-left:0;list-style:none;display:grid;gap:10px}
.sess li{display:grid;grid-template-columns:3.8em 1fr;gap:10px;align-items:start}
.sess .no{font-size:13px;font-weight:700;color:var(--coral);padding-top:3px;font-variant-numeric:tabular-nums}
.sess .desc{font-size:14px;color:var(--muted);margin:0}
.abtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:16px;font-weight:600;line-height:1.4;color:var(--ink)}
.abtn:hover{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
/* all abstracts */
.filters{display:grid;gap:12px;margin-bottom:10px}
.count{font-size:14px;color:var(--muted)}
details.topic{background:var(--surface);border-radius:20px;margin-bottom:12px;padding:0 20px}
details.topic>summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary h2{font-size:19px}
details.topic>summary h2::before{content:"+";display:inline-block;width:1.3em;color:var(--coral);font-weight:800}
details.topic[open]>summary h2::before{content:"–"}
.tn{font-size:13px;font-weight:800;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.rows{display:grid;padding-bottom:14px}
.row{display:grid;grid-template-columns:3.8em 1fr;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.row .meta{grid-column:2;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.row .no{font-size:13px;font-weight:700;color:var(--coral);padding-top:3px;font-variant-numeric:tabular-nums}
/* reader panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.reader{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(740px,100%);background:var(--bg);overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));box-shadow:-10px 0 40px rgba(15,57,106,.18)}
.reader .close{position:sticky;top:0;display:flex;justify-content:flex-end;background:var(--bg);padding-bottom:8px;z-index:1}
.reader .close button{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:14px}
.reader h2{font-size:26px;font-weight:800;margin:10px 0 16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;background:var(--surface);border-radius:16px;padding:16px 20px;margin-bottom:16px}
.facts dt{color:var(--faint);font-weight:600} .facts dd{margin:0;min-width:0;font-weight:600}
.why{background:var(--coral-soft);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.why b{color:var(--key)}
.abs{font-size:17px;line-height:1.75;max-width:66ch;color:var(--ink)}
.abs p{margin:0 0 14px}
.abs p>strong:first-child{display:block;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin-top:10px}
.abs table{border-collapse:collapse;font-size:13px;background:var(--surface)}
.abs td,.abs th{border:1px solid var(--line);padding:4px 6px}
.tablewrap{overflow-x:auto}
.reader h4{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin:24px 0 6px}
.small{font-size:14px;color:var(--muted)}
.reader details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--teal);margin-top:12px}
footer{margin-top:56px;padding-top:20px;border-top:2px solid var(--line);font-size:13px;color:var(--faint);max-width:70ch}
@media (max-width:420px){nav.tabs .n{display:none}nav.tabs a{padding:9px 14px}}
@media (max-width:560px){.slot{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.facts dt{margin-top:6px}.brandbar img{height:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const PAYLOAD = __PAYLOAD__;
const TOPICS = [
  ["FT","Frontline treatment","First treatment after diagnosis, including chemotherapy-free regimens."],
  ["RR","Relapsed or refractory treatment","BTK inhibitors, bispecific antibodies, antibody-drug conjugates and other drugs after earlier treatment."],
  ["CT","CAR-T and stem cell transplant","Cell therapies and transplant."],
  ["BIO","Biology, biomarkers and prognosis","Genetics, MRD testing, PET imaging, risk scores and lab research."],
  ["RW","Real-world outcomes and access","Registries, treatment patterns, survival trends and access to care."],
  ["SAFE","Safety, supportive care and quality of life","Side effects, infections, heart risks and patient-reported outcomes."]
];
const TIERS = {1:"MCL focus",2:"Includes MCL data",3:"Mentions MCL"};
const KEYORDER = ["6","1791","1015","1016","1018","1017","1019","235","236","1784","237","238","1032"];
let A = [], S = {}, byPid = {};
const st = { view:"highlights", day:null, schedAll:false, showAll:false, q:"" };

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("unlock"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening..."; err.textContent = "";
  let data;
  try { data = await decrypt(document.getElementById("pw").value); }
  catch(x) { err.textContent = "That password didn't work. Check it and try again."; btn.disabled = false; btn.textContent = "Open briefing"; return; }
  A = data.abstracts; S = data.sessions; A.forEach(x => byPid[x.pid] = x);
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  shell(); route();
  window.addEventListener("hashchange", route);
});

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayShort = d => (d||"").replace(/, 2026$/,"").replace("December","Dec");
const dayKey = d => { const m = (d||"").match(/December (\d+)/); return m ? +m[1] : 0; };
function tmin(t){ const m = (t||"").match(/(\d+):(\d+)\s*([ap])/i); if(!m) return 0; let h=+m[1]%12; if(m[3].toLowerCase()==="p") h+=12; return h*60+ +m[2]; }
function fmtTime(t){
  const p = (t||"").split(/\s*-\s*/).map(x => { const m = x.match(/(\d+):(\d+)\s*([ap])/i); return m ? {h:+m[1], mm:m[2], ap:m[3].toLowerCase()==="a"?"am":"pm"} : null; });
  if (!p[0]) return t;
  const f = o => `${o.h}:${o.mm}`;
  return p[1] ? (p[0].ap===p[1].ap ? `${f(p[0])}–${f(p[1])} ${p[1].ap}` : `${f(p[0])} ${p[0].ap}–${f(p[1])} ${p[1].ap}`) : `${f(p[0])} ${p[0].ap}`;
}
const fmt = t => /Marquee/.test(t) ? "Plenary" : /Oral/.test(t) ? "Oral" : /Poster/.test(t) ? "Poster" : t;
const place = r => /^MCCNO - /.test(r||"") ? r.replace(/^MCCNO - /,"") + ", Convention Center" : (r||"");
const firstAuthor = a => a.length ? a[0].split(",")[0] + (a.length>1 ? " et al." : "") : "";
const sessShort = s => s.replace(/^\d{3}\.\s*/,"").replace(/:\s*Poster (I|II|III)$/,"");

function shell(){
  const keys = A.filter(x=>x.key).length, focus = A.filter(x=>x.tier===1).length;

    <div class="eyebrow">ASH Annual Meeting · New Orleans · Dec 12–15, 2026</div>
    <h1>Mantle cell lymphoma at ASH 2026</h1>
    <p class="lede">${focus} abstracts focus on mantle cell lymphoma (MCL), and ${A.length-focus} more include or mention it. Start with the highlights, plan your days with the schedule, or browse everything by topic.</p>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#highlights" data-v="highlights">Highlights<span class="n">${keys}</span></a>
    <a href="#schedule" data-v="schedule">Schedule</a>
    <a href="#abstracts" data-v="abstracts">All abstracts<span class="n">${A.length}</span></a>
  </nav>
  <main id="view" class="view"></main>
  <footer>Source: ASH 2026 Annual Meeting online program (onlineprogram.hematology.org), retrieved November 5, 2026. Abstract text is reproduced as published by ASH. Times and rooms can change, so check the ASH program or app before you go. Highlights are an editorial selection for the MCLA Board, not an ASH designation.</footer>`;

function route(){
  const h = location.hash.replace("#","");
  st.view = ["highlights","schedule","abstracts"].includes(h) ? h : "highlights";
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.v===st.view ? "page" : "false"));
  ({highlights:viewHighlights, schedule:viewSchedule, abstracts:viewAbstracts})[st.view]();
}

function whenWhere(x){
  return `<div class="when"><span class="pill${x.key?" key":""}">${fmt(x.type)}</span><span><b>${esc(dayShort(x.day))}</b>, ${esc(fmtTime(x.time))}</span><span>${esc(x.room.replace(/^MCCNO - /,""))}</span></div>`;
}

function viewHighlights(){
  const keys = KEYORDER.map(n => A.find(x=>x.no===n)).filter(Boolean);
  document.getElementById("view").innerHTML = `
    <p class="intro">The ${keys.length} abstracts most likely to change MCL care: randomized trials, first results of new frontline regimens, long-term follow-up of approved therapies, and new options after BTK inhibitors.</p>
    <div class="hl">${keys.map(x=>`
      <article class="hcard">
        <p class="take">${esc(x.key)}</p>
        <div class="t">#${esc(x.no)} · ${esc(x.title)}</div>
        ${whenWhere(x)}
        <div><button class="linkbtn" type="button" data-open="${x.pid}">Read abstract</button></div>
      </article>`).join("")}</div>`;
  bindOpen();
}

function viewSchedule(){
  const sess = Object.values(S).map(s => ({...s, items: s.papers.map(p=>byPid[p]).filter(Boolean)}))
    .filter(s => s.items.length || !s.total);
  const days = [...new Set(sess.map(s=>s.day))].sort((a,b)=>dayKey(a)-dayKey(b));
  if (!st.day || !days.includes(st.day)) st.day = days.find(d=>dayKey(d)===12) || days[0];
  const vis = s => !s.total || st.schedAll || s.items.some(x=>x.tier===1);
  const today = sess.filter(s => s.day===st.day && vis(s));
  const slots = {};
  today.forEach(s => (slots[s.time] ||= []).push(s));
  const order = Object.keys(slots).sort((a,b)=>tmin(a)-tmin(b));
  const itemsOf = s => (st.schedAll ? s.items : s.items.filter(x=>x.tier===1));
  const li = x => `<li><span class="no">#${esc(x.no)}</span><span><button class="abtn" type="button" data-open="${x.pid}">${esc(x.title)}</button>${x.key?' <span class="pill key">Highlight</span>':''}${st.schedAll && x.tier>1?` <span class="small">· ${TIERS[x.tier]}</span>`:''}</span></li>`;
  const card = s => {
    const its = itemsOf(s).sort((a,b)=>/Poster/.test(s.type) ? (+a.no - +b.no) : s.papers.indexOf(a.pid)-s.papers.indexOf(b.pid));
    const room = s.room.replace(/^MCCNO - /,"");
    const venue = /^MCCNO/.test(s.room) ? "Convention Center" : (s.room.split(" - ")[0]||"");
    return `<div class="sess">
      <div class="where">${esc(room)} <span>· ${esc(venue)}</span></div>
      <div class="sname">${esc(fmt(s.type))} · ${esc(/Poster/.test(s.type)? sessShort(s.title) : s.title)}</div>
      ${s.total ? `<ol>${its.map(li).join("")}</ol>` : `<p class="desc">Industry-sponsored session on MCL treatment. ${esc(s.type)}.</p>`}
    </div>`;
  };
  const slotHTML = t => {
    const list = slots[t];
    const posters = list.filter(s=>/Poster/.test(s.type)), others = list.filter(s=>!/Poster/.test(s.type));
    let inner = others.map(card).join("");
    if (posters.length){
      const n = posters.reduce((k,s)=>k+itemsOf(s).length,0);
      inner += `<div class="sess"><div class="where">Poster Hall F <span>· Convention Center</span></div>
        <div class="sname">${n} ${st.schedAll?"MCL-related":"MCL-focused"} posters. Posters are listed by abstract number.</div>
        <ol>${posters.flatMap(itemsOf).sort((a,b)=>+a.no - +b.no).map(li).join("")}</ol></div>`;
    }
    return `<div class="slot"><div class="time">${esc(fmtTime(t))}</div><div class="sessions">${inner}</div></div>`;
  };
  document.getElementById("view").innerHTML = `
    <p class="intro">When and where each MCL presentation happens. Talks are listed in the order they're presented in each session.</p>
    <div class="days" role="group" aria-label="Day">${days.map(d=>`<button class="chip" type="button" data-day="${esc(d)}" aria-pressed="${d===st.day}">${esc(dayShort(d))}</button>`).join("")}</div>
    <label class="toggle"><input type="checkbox" id="schedAll" ${st.schedAll?"checked":""}> Also show abstracts that only include or mention MCL</label>
    ${order.length ? order.map(slotHTML).join("") : `<p class="muted">No MCL-focused sessions this day. Turn on the option above to see other abstracts.</p>`}`;
  document.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => { st.day = b.dataset.day; viewSchedule(); }));
  document.getElementById("schedAll").addEventListener("change", e => { st.schedAll = e.target.checked; viewSchedule(); });
  bindOpen();
}

function viewAbstracts(){
  const v = document.getElementById("view");
  v.innerHTML = `
    <div class="filters">
      <input id="q" type="search" placeholder="Search titles, authors, drugs or institutions" aria-label="Search abstracts" value="${esc(st.q)}">
      <label class="toggle" style="margin:0"><input type="checkbox" id="showAll" ${st.showAll?"checked":""}> Also show abstracts that only include or mention MCL</label>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div id="groups"></div>`;
  v.querySelector("#q").addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); groups(); });
  v.querySelector("#showAll").addEventListener("change", e => { st.showAll = e.target.checked; groups(); });
  groups();
}
function groups(){
  const ok = x => (st.showAll || x.tier===1) && (!st.q || st.q.split(/\s+/).every(w => (x._s ||= [x.no,x.title,x.authors.join(" "),x.affils.join(" "),x.abstract.replace(/<[^>]+>/g," ")].join(" ").toLowerCase()).includes(w)));
  const list = A.filter(ok);
  document.getElementById("count").textContent = `${list.length} abstracts`;
  const open = !!st.q;
  document.getElementById("groups").innerHTML = TOPICS.map(([c,name,desc]) => {
    const g = list.filter(x=>x.topic===c).sort((a,b)=>(a.tier-b.tier)||((b.key?1:0)-(a.key?1:0))||(+a.no - +b.no));
    if (!g.length) return "";
    return `<details class="topic"${open?" open":""}><summary><h2>${name}</h2><span class="tn">${g.length}</span></summary>
      <p class="small" style="margin:0 0 6px">${desc}</p>
      <div class="rows">${g.map(x=>`<div class="row"><span class="no">#${esc(x.no)}</span>
        <span><button class="abtn" type="button" data-open="${x.pid}">${esc(x.title)}</button></span>
        <span class="meta"><span>${esc(firstAuthor(x.authors))}</span><span>${fmt(x.type)} · ${esc(dayShort(x.day))}, ${esc(fmtTime(x.time))}</span>${x.key?'<span class="pill key">Highlight</span>':''}${x.tier>1?`<span>${TIERS[x.tier]}</span>`:''}</span></div>`).join("")}</div></details>`;
  }).join("") || `<p class="muted">No abstracts match. Try a different word, or turn on the option above.</p>`;
  bindOpen();
}

function bindOpen(){
  document.querySelectorAll("#view [data-open]").forEach(b => b.onclick = () => openReader(b.dataset.open, b));
}
let lastFocus = null;
function openReader(pid, from){
  const x = byPid[pid]; if (!x) return;
  lastFocus = from;
  const r = document.getElementById("reader");
  r.innerHTML = `
    <div class="close"><button type="button" id="rclose">Close</button></div>
    <div class="eyebrow">Abstract #${esc(x.no)} · ${TIERS[x.tier]}</div>
    <h2 id="rtitle">${esc(x.title)}</h2>
    ${x.key?`<div class="why"><b>Why it matters.</b> ${esc(x.key)}</div>`:""}
    <dl class="facts">
      <dt>When</dt><dd>${esc(x.day)}, ${esc(fmtTime(x.time))}</dd>
      <dt>Where</dt><dd>${esc(place(x.room))}</dd>
      <dt>Format</dt><dd>${esc(fmt(x.type))}</dd>
      <dt>Session</dt><dd>${esc(x.session)}</dd>
      <dt>Presenter</dt><dd>${esc(x.authors[0]||"")}</dd>
    </dl>
    <div class="abs tablewrap">${x.abstract}</div>
    <h4>All authors</h4><div class="small">${esc(x.authors.join("; "))}</div>
    <details><summary>Affiliations (${x.affils.length})</summary><ol class="small">${x.affils.map(a=>`<li>${esc(a)}</li>`).join("")}</ol></details>
    ${x.disclosures?`<details><summary>Disclosures</summary><p class="small">${esc(x.disclosures)}</p></details>`:""}
    <p style="margin-top:20px"><a href="${esc(x.url)}" target="_blank" rel="noopener">View on the ASH program</a></p>`;
  r.hidden = false; document.getElementById("scrim").hidden = false; document.body.style.overflow = "hidden";
  r.scrollTop = 0; document.getElementById("rclose").focus();
  document.getElementById("rclose").onclick = closeReader;
}
function closeReader(){
  document.getElementById("reader").hidden = true; document.getElementById("scrim").hidden = true; document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("scrim").addEventListener("click", closeReader);
document.addEventListener("keydown", e => { if (e.key==="Escape" && !document.getElementById("reader").hidden) closeReader(); });
</script>
